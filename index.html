<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KOOKV_KPOP | Order Tracking</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;700&display=swap" rel="stylesheet">

</head>

<body>

<header>

<div class="logo">

<img src="https://drive.google.com/thumbnail?id=1vqRCoAh1iXxq_5GVUD94ySXUJmUkHvHk&sz=w500" alt="KOOKV_KPOP">

<h1>KOOKV_KPOP</h1>

<p class="subtitle">Order Tracking System</p>

<div class="language">
<button id="thBtn">🇹🇭 ไทย</button>
<button id="enBtn">🇺🇸 English</button>
</div>

</div>

</header>

<main class="container">

<section class="search-card">

<h2>🔍 เช็กสถานะสินค้า</h2>

<p>ค้นหาด้วยเลขออเดอร์ (เช่น KV001) หรือเลข Tracking</p>

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="เช่น KV001 หรือ SF123456789KR"
>

<button id="searchBtn">
ค้นหา
</button>

</div>

</section>

<section id="result" class="hidden">

<div class="product">

<img
id="productImage"
src=""
alt="สินค้า"
>

</div>

<div class="detail">

<h2 id="productName">ชื่อสินค้า</h2>

<div class="info-card">

<div class="info-row">
<span>🟣 Order No.</span>
<strong id="orderNo">-</strong>
</div>

<div class="info-row">
<span>🟢 สถานะ</span>
<span id="statusBadge">-</span>
</div>

<div class="info-row">
<span>👤 ลูกค้า</span>
<span id="customer">-</span>
</div>

<div class="info-row">
<span>📦 LOT</span>
<span id="lot">-</span>
</div>

<div class="info-row">
<span>🔢 จำนวน</span>
<span id="qty">-</span>
</div>

<div class="info-row">
<span>🚚 Tracking</span>

<div>
<span id="tracking">-</span>

<button id="copyBtn">
📋 Copy
</button>
</div>

</div>

<div class="info-row">
<span>📝 หมายเหตุ</span>
<span id="remark">-</span>
</div>

<div class="info-row">
<span>📅 อัปเดตล่าสุด</span>
<span id="update">-</span>
</div>

</div>

</div>

</section>

</main>

<footer>

<a
href="https://lin.ee/VAJ5e23"
target="_blank"
class="line"
>
LINE
</a>

<a
href="https://www.instagram.com/kookv_kpop"
target="_blank"
class="ig"
>
Instagram
</a>

<p>© 2026 KOOKV_KPOP</p>

</footer>

<script type="module" src="script.js"></script>

</body>
</html>
